name = "lean_trominoes"
version = "0.1.0"
keywords = ["math", "tiling", "computability"]
defaultTargets = ["LeanTrominoes"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
# Kernel reduction of the finite certificates needs larger elaboration limits.
maxHeartbeats = 2000000
maxRecDepth = 10000

[[require]]
name = "lean_wang"
git = "https://github.com/edemaine/lean-wang"
rev = "6c4711c2329b444bc3096e883912e00773dcce50"

[[lean_lib]]
name = "LeanTrominoes"
globs = ["LeanTrominoes.*"]
