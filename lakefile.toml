name = "lean_trominoes"
version = "0.1.0"
keywords = ["math", "tiling", "computability"]
defaultTargets = ["LeanTrominoes"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
# Preserve type-alias unfolding used by existing proofs and Fintype derivation.
backward.isDefEq.respectTransparency = false
# Kernel reduction of the finite certificates needs larger elaboration limits.
maxHeartbeats = 2000000
maxRecDepth = 10000

[[require]]
name = "lean_wang"
git = "https://github.com/edemaine/lean-wang"
rev = "64268a3aaaef3eac65559352ef94f62ab9c00482"

[[lean_lib]]
name = "LeanTrominoes"
globs = ["LeanTrominoes.*"]
